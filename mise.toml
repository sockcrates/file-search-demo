[plugins]
clang-tidy = "https://github.com/mise-plugins/mise-llvm.git"

[settings]
github_attestations = true
provenance_api_failures_fatal = true
slsa = true

[tools]
clang = "21.1.8"
clangd = "21.1.8"
clang-format = "21.1.8"
clang-tidy = "21.1.8"
cmake = "4.0.1"
"github:doxygen/doxygen" = "Release_1_17_0"

[tasks.configure]
description = "Configure the CMake build with LLVM Clang"
run = "cmake -S . -B build -DCMAKE_CXX_COMPILER=\"$(mise which clang++)\" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON"

[tasks.build]
description = "Build the project"
depends = ["configure"]
run = "cmake --build build"

[tasks.test]
description = "Build and run the test suite"
depends = ["build"]
run = "ctest --test-dir build --output-on-failure"

[tasks.lint]
description = "Compile all targets with Clang warnings treated as errors"
depends = ["build"]
run = "cmake --build build"

[tasks.tidy]
description = "Enforce the mandatory C++ Core Guidelines policy with clang-tidy"
depends = ["configure"]
run = "clang-tidy -p build --config-file=.clang-tidy $(git ls-files '*.cpp' '*.h')"

[tasks.format]
description = "Format C++ source files with clang-format"
run = "clang-format -i $(git ls-files '*.cpp' '*.h')"

[tasks.format-check]
description = "Check C++ source files are formatted with clang-format"
run = "clang-format --dry-run --Werror $(git ls-files '*.cpp' '*.h')"

[tasks.sanitizer]
description = "Run tests with address and undefined behaviour sanitizers"
run = "cmake -S . -B build-sanitize -DCMAKE_CXX_COMPILER=\"$(mise which clang++)\" -DENABLE_SANITIZERS=ON && cmake --build build-sanitize && ctest --test-dir build-sanitize --output-on-failure"

[tasks.benchmark]
description = "Run repeatable in-memory search workloads and report elapsed time and read volume"
run = "cmake -S . -B build-benchmark -DCMAKE_CXX_COMPILER=\"$(mise which clang++)\" && cmake --build build-benchmark --target find_benchmark && ./build-benchmark/find_benchmark"

[tasks.check]
description = "Run the required formatting, Core Guidelines, build, and test gate"
depends = ["format-check", "tidy", "lint", "test"]

[tasks.clean]
description = "Remove generated build artifacts"
run = "cmake -E rm -rf build"
