name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  quality:
    name: Format, static analysis, and build quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Check formatting
        run: mise run format-check
      - name: Run clang-tidy policy
        run: mise run tidy
      - name: Build with warnings as errors
        run: mise run lint

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Run CTest suite
        run: mise run test

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Run sanitizer test suite
        run: mise run sanitizer
