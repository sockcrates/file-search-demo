name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, static analysis, and build quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Check formatting
        run: mise run format-check
      - name: Run clang-tidy policy
        run: mise run tidy
      - name: Build with warnings as errors
        run: mise run lint

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Run CTest suite
        run: mise run test

  sanitizers:
    name: AddressSanitizer and UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: /usr/lib/llvm-21/bin/clang
      CXX: /usr/lib/llvm-21/bin/clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
      - name: Install prebuilt LLVM 21
        run: bash scripts/ci/install-llvm-21.sh
      - name: Run sanitizer test suite
        run: mise run sanitizer
